<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-list>
   @for (item of listOfRecipents(); track item.id) {
     <ion-item routerLink="/recipies-detail/{{item.id}}" detail="true">
      <ion-avatar slot="start">
        <ion-img [src]="item.imageUrl" class="md hydrated" />
      </ion-avatar>
       <ion-label>
         <h2>{{item.title}}</h2>
       </ion-label>
     </ion-item>
   }
  </ion-list>
</ion-content>
